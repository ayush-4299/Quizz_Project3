{% if form.non_field_errors %}<div class="form-error">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form.visible_fields %}
  {% if field.name == "remember" %}
  <label class="check">{{ field }} <span>{{ field.label }}</span></label>
  {% else %}
  <div class="field">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% for err in field.errors %}<p class="field-error">{{ err }}</p>{% endfor %}
  </div>
  {% endif %}
{% endfor %}
{% if redirect_field_value %}<input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">{% endif %}
